---
# Cloud Foundry manifest for MIRA
# Deploys the FastAPI backend using the Python buildpack.
applications:
  - name: mira-api
    memory: 512M
    disk_quota: 1G
    instances: 1
    buildpack: python_buildpack
    command: uvicorn services.api:app --host 0.0.0.0 --port $PORT
    env:
      # Example env vars (set real secrets with `cf set-env` or service bindings)
      MIRA_EMBEDDING_BACKEND: "genai_hub"
      MIRA_LLM_BACKEND: "genai_hub"
      # Add other defaults as needed
